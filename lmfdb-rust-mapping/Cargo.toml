[package]
name = "lmfdb-rust-mapping"
version = "0.1.0"
edition = "2021"

[lib]
name = "lmfdb_rust_mapping"
path = "src/lib.rs"

[dependencies]
lmfdb-types = { path = "lmfdb-types" }
lmfdb-traits = { path = "lmfdb-traits" }
goblin = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
