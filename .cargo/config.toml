[build]
# Enable custom lints
rustflags = [
  "-W", "clippy::unwrap_used",
  "-W", "clippy::expect_used",
  "-D", "clippy::todo",
  "-D", "clippy::unimplemented",
]

[alias]
# Convenience aliases
lint = "clippy --all-targets --all-features -- -D warnings"
demo-check = "rustc -- -L demo2code-lint/target/release -Z extra-plugins=demo2code_lint"
