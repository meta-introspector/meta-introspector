[package]
name = "git-sources"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "git-sources"
path = "git-sources.rs"

[[bin]]
name = "ingest-github-lists"
path = "ingest-github-lists.rs"

[[bin]]
name = "github-activity-scanner"
path = "github-activity-scanner.rs"

[[bin]]
name = "github-cached-scanner"
path = "github-cached-scanner.rs"

[[bin]]
name = "build-activity-dataset"
path = "build-activity-dataset.rs"

[[bin]]
name = "check-activity-coverage"
path = "check-activity-coverage.rs"

[[bin]]
name = "github-month-activity"
path = "github-month-activity.rs"

[[bin]]
name = "github-comprehensive-activity"
path = "github-comprehensive-activity.rs"

[[bin]]
name = "github-events-collector"
path = "github-events-collector.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
octocrab = "0.41"
gix = "0.68"
tokio = { version = "1", features = ["full"] }
crossbeam = "0.8"
