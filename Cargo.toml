[package]
name = "meta-introspector-queue"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "queue_manager"
path = "repo_queue_manager.rs"

[[bin]]
name = "repo_worker"
path = "repo_worker.rs"

[[bin]]
name = "multi_worker"
path = "multi_worker.rs"

[[bin]]
name = "focused_queue_builder"
path = "focused_queue_builder.rs"

[[bin]]
name = "commit_collector"
path = "commit_collector.rs"

[[bin]]
name = "all_commits_collector"
path = "all_commits_collector.rs"

[[bin]]
name = "https_commit_fetcher"
path = "https_commit_fetcher.rs"

[[bin]]
name = "local_commit_cache"
path = "local_commit_cache.rs"

[[bin]]
name = "crossbeam_rustc_analyzer_complete"
path = "crossbeam_rustc_analyzer_complete.rs"

[[bin]]
name = "commits_by_user"
path = "commits_by_user.rs"

[[bin]]
name = "mike_repos"
path = "mike_repos.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
quote = "1.0"
serde_json = "1.0"
crossbeam = "0.8"
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.6"
goblin = "0.8"
glob = "0.3"
regex = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
xz2 = "0.1"
tar = "0.4"
[[bin]]
name = "semantic_rust_compressor"
path = "semantic_rust_compressor.rs"
[[bin]]
name = "grammar_rust_compressor"
