[package]
name = "meta-introspector-queue"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "queue_manager"
path = "repo_queue_manager.rs"

[[bin]]
name = "repo_worker"
path = "repo_worker.rs"

[[bin]]
name = "multi_worker"
path = "multi_worker.rs"

[[bin]]
name = "focused_queue_builder"
path = "focused_queue_builder.rs"

[[bin]]
name = "commit_collector"
path = "commit_collector.rs"

[[bin]]
name = "all_commits_collector"
path = "all_commits_collector.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
