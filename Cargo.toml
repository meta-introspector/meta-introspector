[package]
name = "meta-introspector"
version = "0.1.0"
edition = "2021"

[lib]
name = "meta_introspector"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
quote = "1.0"
goblin = "0.8"
crossbeam = "0.8"
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.6"
glob = "0.3"
regex = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
xz2 = "0.1"
tar = "0.4"
serde_json = "1.0"
rustc-demangle = "0.1"
cpp_demangle = "0.4"

[build-dependencies]
serde_json = "1.0"
crossbeam = "0.8"
serde = { version = "1.0", features = ["derive"] }
# Rust-as-a-Service dependencies
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
libloading = "0.8"
tempfile = "3.0"
sha2 = "0.10"

[[bin]]
name = "extract_so_functions"
path = "extract_so_functions.rs"

[[bin]]
name = "demangle_and_hook_generator"
path = "demangle_and_hook_generator.rs"

[[bin]]
