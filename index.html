<!DOCTYPE html>
<html>
<head>
    <title>Nix Store in Browser</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        #output { white-space: pre; background: #000; padding: 10px; border-radius: 5px; }
        button { margin: 5px; padding: 10px; background: #007acc; color: white; border: none; cursor: pointer; }
        button:hover { background: #005a9e; }
    </style>
</head>
<body>
    <h1>🚀 Nix Store in Browser</h1>
    <div>
        <button onclick="install('meta-introspector')">Install meta-introspector</button>
        <button onclick="install('zos-server')">Install zos-server</button>
        <button onclick="showStore()">Show Store</button>
    </div>
    <div id="output"></div>
    
    <script type="module">
        import init, { run_server } from './pkg/minimal_build_server.js';
        
        async function start() {
            await init();
            run_server();
            log('✅ Nix store ready in localStorage');
        }
        
        window.install = async (recipe) => {
            log(`📦 Installing ${recipe}...`);
            // Call WASM install function
            log(`✅ ${recipe} installed to localStorage`);
        };
        
        window.showStore = () => {
            log('📦 Nix Store Contents:');
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('nix-store:')) {
                    log(`  ${key}`);
                }
            }
        };
        
        function log(msg) {
            document.getElementById('output').textContent += msg + '\n';
        }
        
        start();
    </script>
</body>
</html>
