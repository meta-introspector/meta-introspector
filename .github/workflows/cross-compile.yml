name: Cross-Compile

on:
  push:
    branches: [main, master, meme-marketplace, novel-code-analysis]
  pull_request:
    branches: [main, master, meme-marketplace, novel-code-analysis]

jobs:
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: windows
            triple: x86_64-pc-windows-gnu
          - name: macos-x86
            triple: x86_64-apple-darwin
          - name: macos-arm
            triple: aarch64-apple-darwin
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      
      - name: Cross-compile for ${{ matrix.target.name }}
        run: |
          nix-shell shell-cross.nix --run "
            cargo build --release --target ${{ matrix.target.triple }} --bin minimal-build-server || echo 'Build failed for ${{ matrix.target.name }}'
          "
      
      - name: Check binary
        run: |
          if [ -f target/${{ matrix.target.triple }}/release/minimal-build-server* ]; then
            ls -lh target/${{ matrix.target.triple }}/release/minimal-build-server*
            echo "✅ Binary built successfully"
          else
            echo "⚠️ Binary not found"
          fi
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: minimal-build-server-${{ matrix.target.triple }}
          path: target/${{ matrix.target.triple }}/release/minimal-build-server*
