name: Build All Binaries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      
      - name: Build meta-introspector binaries
        run: nix build .#meta-introspector-binaries
      
      - name: Build zos-server
        run: nix build .#zos-server
      
      - name: Build rust-telemetry-driver
        run: nix build .#rust-telemetry-driver
      
      - name: Build librustc
        run: nix build .#librustc || true
      
      - name: List built binaries
        run: ls -lah result/bin/ || true
