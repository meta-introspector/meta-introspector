name: Build All Binaries

on:
  push:
    branches: [ main, master, meme-marketplace, novel-code-analysis ]
  pull_request:
    branches: [ main, master, meme-marketplace, novel-code-analysis ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      
      - name: Build meta-introspector binaries (220 binaries)
        run: nix build .#meta-introspector-binaries
      
      - name: Build minimal-build-server
        run: nix build .#minimal-build-server
      
      - name: Build zos-server
        run: nix build .#zos
      
      - name: Build rust-telemetry-driver
        run: nix build .#telemetry-driver
      
      - name: Build librustc
        run: nix build .#librustc-pkg
      
      - name: List built binaries
        run: |
          echo "=== Meta-introspector binaries ==="
          ls -lh result/bin/ | head -20
          echo ""
          echo "Total binaries: $(ls result/bin/ | wc -l)"
          echo ""
          echo "=== Demo binaries ==="
          ls result/bin/ | grep "^demo_" || echo "No demo binaries found"
      
      - name: Test minimal-build-server
        run: |
          ./result/bin/minimal-build-server --version || echo "Version check not implemented"
          echo "Build successful!"
