name: Nix CI/CD - LMFDB Analysis

on:
  push:
    branches: [main, master, novel-code-analysis-clean]
  pull_request:
  workflow_dispatch:

jobs:
  nix-build-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      
      - name: Setup Cachix
        uses: cachix/cachix-action@v12
        with:
          name: meta-introspector
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      
      - name: Run all checks (builds + analysis)
        run: nix flake check -L
      
      - name: Build all packages
        run: nix build .#default -L
      
      - name: Run full analysis pipeline
        run: nix run .#analyze-all
      
      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: |
            data/concept_map.json
            data/numerical_patterns.json
            data/nix_lmfdb_analysis/
          retention-days: 90
      
      - name: Upload to HuggingFace
        if: github.ref == 'refs/heads/novel-code-analysis-clean'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          nix develop -c bash << 'EOF'
          # Upload analysis results to HuggingFace
          if [ -n "$HF_TOKEN" ]; then
            pip install huggingface_hub
            python3 << 'PYTHON'
          from huggingface_hub import HfApi
          import os
          
          api = HfApi(token=os.environ['HF_TOKEN'])
          
          # Upload concept map
          api.upload_file(
              path_or_fileobj="data/concept_map.json",
              path_in_repo="analysis/concept_map.json",
              repo_id="introspector/meta-introspector-collective",
              repo_type="dataset"
          )
          
          # Upload LMFDB analysis
          api.upload_folder(
              folder_path="data/nix_lmfdb_analysis",
              path_in_repo="analysis/lmfdb",
              repo_id="introspector/meta-introspector-collective",
              repo_type="dataset"
          )
          
          print("✅ Uploaded to HuggingFace")
          PYTHON
          fi
          EOF
