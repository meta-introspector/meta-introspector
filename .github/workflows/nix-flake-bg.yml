name: Nix Flake CI (Background)

on:
  push:
    branches: [main, master, novel-code-analysis-clean]
  pull_request:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  nix-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      
      - name: Setup Cachix
        uses: cachix/cachix-action@v12
        with:
          name: meta-introspector
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      
      - name: Check flake
        run: nix flake check -L --keep-going || true
      
      - name: Build default package
        run: nix build .#default -L --keep-going || true
      
      - name: Build all packages
        run: |
          nix build .#concept-map -L --keep-going || true
          nix build .#lmfdb-analysis -L --keep-going || true
          nix build .#numerical-codebreaker -L --keep-going || true
      
      - name: Push to Cachix
        if: success()
        run: |
          nix path-info --all | cachix push meta-introspector || true
  
  nix-analyze:
    runs-on: ubuntu-latest
    needs: nix-build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v24
      
      - name: Setup Cachix
        uses: cachix/cachix-action@v12
        with:
          name: meta-introspector
      
      - name: Run analysis pipeline
        run: |
          nix run .#analyze-all || true
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-analysis-results-${{ github.run_number }}
          path: |
            data/*.json
            data/*.parquet
            data/nix_lmfdb_analysis/
          retention-days: 30
