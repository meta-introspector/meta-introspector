name: Build with Nix

on:
  push:
    branches: [main, master, meme-marketplace, novel-code-analysis-clean]
  pull_request:
    branches: [main, master, meme-marketplace, novel-code-analysis-clean]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 --branch ${{ github.ref_name }} https://github.com/${{ github.repository }} .
      
      - name: Install Nix
        run: |
          sh <(curl -L https://nixos.org/nix/install) --daemon
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
      
      - name: Build all binaries
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix build .#meta-introspector-binaries -L
      
      - name: List binaries
        run: |
          echo "Built binaries:"
          ls -lh result/bin/ | head -20
          echo "Total: $(ls result/bin/ | wc -l)"
