name: Build and Release

on:
  push:
    branches: [main, master, meme-marketplace]
    tags: ['v*']
  pull_request:
    branches: [main, master, meme-marketplace]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: meta-introspector/meta-introspector

jobs:
  build-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      
      - name: Build all binaries
        run: nix build .#meta-introspector-binaries -L
      
      - name: Create archive
        run: |
          mkdir -p artifacts
          tar czf artifacts/meta-introspector-linux.tar.gz -C result/bin .
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux
          path: artifacts/*.tar.gz

  build-cargo:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Build minimal-build-server
        run: cargo build --release --bin minimal-build-server
      
      - name: Create archive
        shell: bash
        run: |
          mkdir -p artifacts
          cd target/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ../../artifacts/minimal-build-server-${{ matrix.target }}.zip minimal-build-server.exe
          else
            tar czf ../../artifacts/minimal-build-server-${{ matrix.target }}.tar.gz minimal-build-server
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minimal-build-server-${{ matrix.target }}
          path: artifacts/*

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-nix, build-cargo, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
