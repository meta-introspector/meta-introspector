name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main # or master, depending on your default branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: ./github/actions/checkout@main # Changed from actions/checkout@v4

      - name: Setup Python
        # Assuming no custom meta-introspector/setup-python action exists
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material

      - name: Build MkDocs site
        run: mkdocs build

      - name: Upload artifact
        uses: ./github/actions/upload-pages-artifact@main # Changed from actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: ./github/actions/deploy-pages@main # Changed from actions/deploy-pages@v4
