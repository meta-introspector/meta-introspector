[package]
name = "perf-complexity"
version = "0.1.0"
edition = "2021"

[dependencies]
# Perf data parsing
linux-perf-data = "0.8"

# Entropy and complexity
entropy = "0.4"

# Fast analysis
rayon = "1.10"
memmap2 = "0.9"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "perf_complexity"
path = "src/lib.rs"

[[bin]]
name = "perf-complexity"
path = "src/main.rs"
