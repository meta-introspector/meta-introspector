[package]
name = "lmfdb-self-analyzer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "analyze"
path = "src/main.rs"

[[bin]]
name = "extract_grammar"
path = "src/bin/extract_grammar.rs"

[[bin]]
name = "reconstruct_grammar"
path = "src/bin/reconstruct_grammar.rs"

[[bin]]
name = "complete_grammar"
path = "src/bin/complete_grammar.rs"

[[bin]]
name = "scan_nix_store"
path = "src/bin/scan_nix_store.rs"

[[bin]]
name = "nix_store_grammar"
path = "src/bin/nix_store_grammar.rs"

[[bin]]
name = "merge_grammar"
path = "src/bin/merge_grammar.rs"

[[bin]]
name = "analyze_transitions"
path = "src/bin/analyze_transitions.rs"

[[bin]]
name = "analyze_char_transitions"
path = "src/bin/analyze_char_transitions.rs"

[[bin]]
name = "markov_tree"
path = "src/bin/markov_tree.rs"

[[bin]]
name = "markov_full_traversal"
path = "src/bin/markov_full_traversal.rs"

[[bin]]
name = "extract_code_tokens"
path = "src/bin/extract_code_tokens.rs"

[[bin]]
name = "show_code_functions"
path = "src/bin/show_code_functions.rs"

[[bin]]
name = "rust_perf_decoder"
path = "../rust_perf_decoder.rs"

[[bin]]
name = "find_divergence"
path = "src/bin/find_divergence.rs"

[[bin]]
name = "find_unique_instructions"
path = "src/bin/find_unique_instructions.rs"

[[bin]]
name = "find_word_sequences"
path = "src/bin/find_word_sequences.rs"

[[bin]]
name = "extract_actual_chars"
path = "src/bin/extract_actual_chars.rs"

[[bin]]
name = "inspect_parquet"
path = "src/bin/inspect_parquet.rs"

[[bin]]
name = "quick_char_extract"
path = "src/bin/quick_char_extract.rs"

[[bin]]
name = "label_known_functions"
path = "src/bin/label_known_functions.rs"

[[bin]]
name = "compare_enum_struct_profiles"
path = "src/bin/compare_enum_struct_profiles.rs"

[dependencies]
lmfdb-rust-mapping = { path = "../lmfdb-rust-mapping" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
goblin = "0.8"
crossbeam = "0.8"
num_cpus = "1.0"
arrow = "53"
parquet = "53"
glob = "0.3"
linux-perf-data = "0.8"
anyhow = "1.0"
