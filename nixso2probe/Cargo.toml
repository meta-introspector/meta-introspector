[package]
name = "nixso2probe"
version = "0.1.0"
edition = "2021"
description = "Inject perf probes into any data interface and stream structured telemetry to compressed Parquet"

[[bin]]
name = "nixso2probe"
path = "src/main.rs"

[lib]
name = "nixso2probe"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core async and serialization
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI and config
clap = { version = "4.0", features = ["derive"] }
toml = "0.8"

# Parquet and compression
arrow = "53.0"
parquet = { version = "53.0", features = ["async"] }
flate2 = "1.0"
zstd = "0.13"
lz4_flex = "0.11"

# Perf and system probing
libbpf-rs = "0.24"
libc = "0.2"
nix = { version = "0.27", features = ["process", "signal"] }
procfs = "0.16"

# Memory mapping and zero-copy
memmap2 = "0.9"
bytes = "1.5"

# Streaming and buffering
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
parking_lot = "0.12"
dashmap = "5.5"

# Network streaming
tokio-stream = "0.1"
futures = "0.3"

# System integration
walkdir = "2.3"
regex = "1.0"
lazy_static = "1.4"

[build-dependencies]
cc = "1.0"
