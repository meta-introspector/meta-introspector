[package]
name = "dynamic-library-interceptor"
version = "0.1.0"
edition = "2021"

[lib]
name = "dynamic_library_interceptor"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
lazy_static = "1.4"
parking_lot = "0.12"
libloading = "0.8"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[build-dependencies]
cc = "1.0"
