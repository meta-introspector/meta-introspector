[package]
name = "mes-transformer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kleene-compiler"
path = "src/kleene_compiler.rs"

[[bin]]
name = "lmfdb-classifier"
path = "src/lmfdb_classifier.rs"

[[bin]]
name = "omniscience"
path = "src/omniscience.rs"

[[bin]]
name = "tiny-transformer"
path = "src/tiny_transformer.rs"

[dependencies]
sha3 = "0.10"
bincode = "1.3"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
parquet = "53"
rand = "0.8"
