[package]
name = "nixso2wrap"
version = "0.1.0"
edition = "2021"
description = "Generate MCP services and ABI interfaces for all Nix store shared libraries"

[[bin]]
name = "nixso2wrap"
path = "src/main.rs"

[lib]
name = "nixso2wrap"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
walkdir = "2.3"
goblin = "0.8"
libc = "0.2"
libloading = "0.8"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
lazy_static = "1.4"
parking_lot = "0.12"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# MCP Protocol support
jsonrpc-core = "18.0"
jsonrpc-http-server = "18.0"
jsonrpc-derive = "18.0"

# ABI analysis
cpp_demangle = "0.4"
rustc-demangle = "0.1"

[build-dependencies]
cc = "1.0"
