[package]
name = "rust-libc-interceptor"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_libc_interceptor"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
lazy_static = "1.4"
parking_lot = "0.12"

[build-dependencies]
cc = "1.0"
